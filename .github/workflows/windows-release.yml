name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: >-
      (github.event_name == 'push' && !contains(github.ref_name, '-browser-test.')) ||
      (github.event_name == 'release' && github.event.release.prerelease)
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked build dependencies
        run: uv sync --locked --extra gui --no-dev

      - name: Build desktop executable
        run: uv run pyinstaller --noconfirm main.spec

      - name: Prepare stable release assets
        if: ${{ !contains(github.ref_name, '-browser-test.') }}
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "dist/GhostyFlix RPC.exe" -Destination "dist/GhostyFlix.RPC.exe"
          Copy-Item -LiteralPath "LICENSE" -Destination "dist/LICENSE.txt"
          $exeHash = (Get-FileHash -LiteralPath "dist/GhostyFlix.RPC.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $licenseHash = (Get-FileHash -LiteralPath "dist/LICENSE.txt" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Value "$exeHash  GhostyFlix.RPC.exe`n$licenseHash  LICENSE.txt" -Encoding ascii

      - name: Prepare browser companion test assets
        if: ${{ contains(github.ref_name, '-browser-test.') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -Raw -LiteralPath "browser-extension/manifest.json" | ConvertFrom-Json
          $bundle = "dist/GhostyFlix-RPC-3.0-TEST-Browser-Companion"
          $extension = Join-Path $bundle "Browser Activity Extension"
          $null = New-Item -ItemType Directory -Force -Path $extension
          Copy-Item -LiteralPath "dist/GhostyFlix RPC.exe" -Destination (Join-Path $bundle "GhostyFlix RPC.exe")
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $bundle "LICENSE.txt")
          Copy-Item -LiteralPath "BROWSER COMPANION SETUP.txt" -Destination (Join-Path $bundle "START HERE - Browser Companion Setup.txt")
          Copy-Item -Path "browser-extension/*" -Destination $extension -Recurse -Force
          Copy-Item -LiteralPath "docs/BROWSER_COMPANION_TEST_README.md" -Destination (Join-Path $bundle "TEST BUILD - READ BEFORE USE.txt")
          Compress-Archive -Path "$bundle/*" -DestinationPath "$bundle.zip" -Force
          & "browser-extension/package.ps1" -Destination "dist/browser-companion"
          Copy-Item -LiteralPath "LICENSE" -Destination "dist/LICENSE.txt"
          $assets = @(
            "dist/GhostyFlix RPC.exe",
            "$bundle.zip",
            "dist/browser-companion/GhostyFlix-Browser-Companion-$($manifest.version).zip",
            "dist/browser-companion/GhostyFlix-Browser-Companion-$($manifest.version)-unsigned.xpi",
            "dist/LICENSE.txt"
          )
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Value $lines -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isBrowserTest = $env:GITHUB_REF_NAME.Contains("-browser-test.")
          if ($isBrowserTest) {
            $manifest = Get-Content -Raw -LiteralPath "browser-extension/manifest.json" | ConvertFrom-Json
            $assets = @(
              "dist/GhostyFlix RPC.exe",
              "dist/GhostyFlix-RPC-3.0-TEST-Browser-Companion.zip",
              "dist/browser-companion/GhostyFlix-Browser-Companion-$($manifest.version).zip",
              "dist/browser-companion/GhostyFlix-Browser-Companion-$($manifest.version)-unsigned.xpi",
              "dist/LICENSE.txt",
              "dist/SHA256SUMS.txt"
            )
            $title = "GhostyFlix RPC 3.0 Test — Browser Companion"
            $notes = "docs/BROWSER_COMPANION_TEST_RELEASE.md"
          } else {
            $assets = @("dist/GhostyFlix.RPC.exe", "dist/LICENSE.txt", "dist/SHA256SUMS.txt")
            $title = $env:GITHUB_REF_NAME
          }

          gh release view $env:GITHUB_REF_NAME *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            if ($isBrowserTest) {
              gh release edit $env:GITHUB_REF_NAME --title $title --notes-file $notes --prerelease --latest=false
            }
          } elseif ($isBrowserTest) {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title $title --notes-file $notes --prerelease --latest=false
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes
          }
